<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Bibi Hazaratun Nesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="split">

  <!-- Left panel: branding -->
  <div class="panel-brand">
    <div class="brand-content">
      <span class="brand-mark">BHN</span>
      <h1>Welcome back.</h1>
      <p>Sign in to pick up right where you left off — your projects, notes, and progress are all waiting.</p>

      <div class="brand-signal">
        <div class="signal-dot"></div>
        <span id="signalText">Reading emotion in Bangla text…</span>
      </div>
    </div>
  </div>

  <!-- Right panel: login form -->
  <div class="panel-form">
    <form class="login-card" id="loginForm">
      <h2>Sign in</h2>
      <p class="form-sub">Enter your email and password below to continue.</p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" required />
        <button type="button" id="togglePassword" class="toggle-btn" aria-label="Show password">Show</button>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Log In</button>

      <p class="signup-note">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
